<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scenarios (admin)</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1.5rem; line-height: 1.4; }
        h1 { font-size: 1.25rem; }
        table { border-collapse: collapse; width: 100%; max-width: 72rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
        th { background: #f4f4f4; }
        .context { max-width: 22rem; }
    </style>
</head>
<body>
<h1>Sanity check scenarios</h1>
<table>
    <thead>
    <tr>
        <th class="context">Context</th>
        <th>Question</th>
        <th>Option A</th>
        <th>Option B</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="s : ${scenarios}">
        <td class="context" th:text="${s.context}"></td>
        <td th:text="${s.question}"></td>
        <td th:text="${s.optionA.label}"></td>
        <td th:text="${s.optionB.label}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
