<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scenarios — Ship It? Admin</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; }
        h1 { margin-bottom: 1.5rem; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>

<h1>Sanity Check Scenarios</h1>

<table>
    <thead>
    <tr>
        <th>Context</th>
        <th>Question</th>
        <th>Option A</th>
        <th>Option B</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="scenario : ${scenarios}">
        <td th:text="${scenario.context}"></td>
        <td th:text="${scenario.question}"></td>
        <td th:text="${scenario.optionA.label}"></td>
        <td th:text="${scenario.optionB.label}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
